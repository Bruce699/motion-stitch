<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Annotation Voice Mode</title><!--CONFIG--><link rel="stylesheet" href="host.css"></head><body>
<main><section class="frame focused" aria-label="Live annotation sidebar"><div class="surface"></div></section>
<section class="workspace" aria-label="Screen annotation"><div hidden aria-hidden="true"><span id="delivery-status"></span><button id="retry"></button><button id="reload-project"></button><button id="show-project"></button><a id="open-project" target="_blank" rel="noopener noreferrer"></a><button id="share"></button></div>
<div id="capture-stage"><div id="capture-empty"></div><iframe id="project-preview" title="Interactive project preview" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads" hidden></iframe><iframe id="capture" title="Shared window annotation" src="capture.html" allow="display-capture" hidden></iframe><div id="annotation-tools" role="toolbar" aria-label="Canvas annotations" hidden><button type="button" data-mode="rectangle" aria-label="Drag and select" title="Drag and select" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 3"/></svg></button><button type="button" data-mode="laser" aria-label="Laser pen" title="Laser pen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 19 3-7 7-7 4 4-7 7-7 3Z"/><path d="m8 12 4 4M17 3l1-2m3 6 2-1"/></svg></button><button type="button" id="snapshot" aria-label="Capture screenshot" title="Capture screenshot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h4l2-3h4l2 3h4v14H4Z"/><circle cx="12" cy="12" r="4"/></svg></button></div><span id="annotation-status" role="status" aria-live="polite" hidden></span></div>
<span id="capture-status" hidden></span></section></main>
<script src="capture-store.js"></script><script src="voice-bridge.js"></script><script src="host.js"></script></body></html>
