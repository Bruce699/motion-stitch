<!doctype html>
<meta charset="utf-8" />
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font: 18px sans-serif;
    color: #233147;
  }
  main {
    width: 1000px;
    height: 640px;
    background: #f2f4f8;
    display: flex;
  }
  nav {
    width: 190px;
    height: 640px;
    padding: 30px 16px;
    background: #dee5ef;
  }
  .nav-item {
    padding: 12px;
    margin-top: 14px;
  }
  .active {
    background: #b2c6e3;
    border-radius: 8px;
  }
  section {
    width: 810px;
    padding: 34px;
  }
  .summary {
    display: flex;
    gap: 18px;
    margin: 30px 0;
  }
  .summary div {
    background: white;
    padding: 20px;
    width: 220px;
    height: 110px;
    border-radius: 10px;
  }
  .row {
    background: white;
    border-bottom: 1px solid #cad5e2;
    padding: 22px;
  }
</style>
<main>
  <nav data-tilt-id="navigation">
    <strong>Capture fixture</strong>
    <div class="nav-item">Overview</div>
    <div class="nav-item active">Projects</div>
    <div class="nav-item">Settings</div>
  </nav>
  <section>
    <h1>Browser surface</h1>
    <div class="summary" data-tilt-id="summary">
      <div>24 tasks</div>
      <div id="state"></div>
      <div>12 complete</div>
    </div>
    <div data-tilt-id="task-list">
      <div class="row">First captured row</div>
      <div class="row">Second captured row</div>
      <div class="row">Third captured row</div>
    </div>
  </section>
</main>
<script>
  window.tiltSource = {
    ready: () => document.fonts.ready,
    sample({ time }) {
      const revision =
        time < 1.3 || (time > 3.1 && time < 4) || (time > 5.6 && time < 6)
          ? Math.round(time * 10000)
          : time <= 3.1
            ? "before"
            : time <= 5.6
              ? "complete"
              : "settled";
      document.querySelector("#state").textContent = String(revision);
      return { revision };
    },
  };
</script>
